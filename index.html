<script>

let daxFunctions = [];

const container = document.getElementById("functionContainer");
const categoryFilter = document.getElementById("categoryFilter");
const totalCount = document.getElementById("totalCount");

/* ===== ESCAPE HTML (FIX LỖI <table> BIẾN MẤT) ===== */
function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function showStatus(message, level='info'){
    const area = document.getElementById('statusArea');
    if(!area) return;
    const color = level==='error' ? 'text-red-600 bg-red-50 border-red-200' : 'text-gray-700 bg-white border-gray-200';
    area.innerHTML = `<div class="p-4 rounded border ${color}">${escapeHtml(message)}</div>`;
}

function showError(message, details){
    const area = document.getElementById('statusArea');
    if(!area) return;
    let html = `<div class="p-4 rounded border text-red-600 bg-red-50">
        <div><b>Lỗi:</b> ${escapeHtml(message)}</div>`;
    if(details) html += `<pre class="mt-2 text-xs text-gray-700 bg-white p-2 rounded overflow-x-auto">${escapeHtml(details)}</pre>`;
    html += `</div>`;
    area.innerHTML = html;
}

/* ===== LOAD DATA ===== */
async function loadData(){
    container.innerHTML = `<div class="col-span-full p-6 text-center text-gray-600">Đang tải dữ liệu...</div>`;
    try{
        const res = await fetch("daxFunctions.json");
        if(!res.ok) throw new Error('HTTP ' + res.status);
        daxFunctions = await res.json();
        if(!Array.isArray(daxFunctions)) throw new Error('daxFunctions.json không trả về mảng');
        loadCategories();
        render(daxFunctions);
        showStatus(`Đã tải ${daxFunctions.length} hàm từ daxFunctions.json`);
        return;
    }catch(err){
        console.warn('Fetch failed, attempting embedded fallback', err);

        // attempt to read embedded JSON fallback when fetch is blocked (file://)
        const script = document.getElementById('daxData');
        if(script){
            try{
                daxFunctions = JSON.parse(script.textContent);
                if(!Array.isArray(daxFunctions)) throw new Error('Embedded JSON không trả về mảng');
                loadCategories();
                render(daxFunctions);
                showStatus(`Đã tải ${daxFunctions.length} hàm từ dữ liệu nhúng (fallback)`);
                return;
            }catch(parseErr){
                console.error('Embedded JSON parse error', parseErr);
                showError('Không thể phân tích dữ liệu nhúng.', parseErr.message);
            }
        }

        console.error(err);
        totalCount.innerText = 0;
        showError('Không thể tải dữ liệu.', err.message);
        container.innerHTML = `
            <div class="col-span-full p-6 text-center text-red-600">
                Không thể tải dữ liệu: ${escapeHtml(err.message)}.<br/>
                Trình duyệt có thể chặn fetch khi mở file bằng file://. Bạn có thể:
                <div class="mt-3 text-sm text-gray-700">
                    1) Chạy server cục bộ: <code>python -m http.server 8000</code><br/>
                    2) Hoặc mở bằng Live Server trong VS Code.
                </div>
            </div>`;
    }
}

/* ===== RENDER ===== */
function render(data){
    container.innerHTML="";
    totalCount.innerText = data.length;

    data.forEach(f=>{
        const example = generateExample(f);

        container.innerHTML+=`
        <div class="bg-white border p-5 rounded-2xl shadow-sm hover:shadow-lg transition duration-300">

            <div class="flex justify-between items-start mb-2 gap-2">
                <div>
                    <h2 class="text-xl font-bold text-gray-800 break-words">
                        ${escapeHtml(f.name)}
                    </h2>
                    <p class="text-xs text-gray-500 mt-1">${escapeHtml(f.category)}</p>
                </div>

                <div class="flex gap-2">
                    <button data-syntax="${escapeHtml(f.syntax)}"
                        onclick="copyText(this.dataset.syntax)"
                        title="Copy cú pháp"
                        class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded-lg transition shrink-0">
                        Copy
                    </button>
                    <button data-example="${escapeHtml(example)}"
                        onclick="copyText(this.dataset.example)"
                        title="Copy ví dụ"
                        class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg transition shrink-0">
                        Copy ví dụ
                    </button>
                </div>
            </div>

            <p class="text-sm mb-3">
                <b>Cú pháp:</b>
                <code class="block bg-gray-100 px-3 py-2 rounded mt-1 text-xs overflow-x-auto whitespace-pre-wrap break-all">
${escapeHtml(f.syntax)}
                </code>
            </p>

            <p class="text-sm text-gray-700 mb-3 break-words">
                ${escapeHtml(f.description)}
            </p>

            <div class="mt-2">
                <b class="text-sm">Ví dụ:</b>
                <pre class="bg-gray-900 text-green-200 p-3 rounded mt-2 text-sm overflow-x-auto"><code>${escapeHtml(example)}</code></pre>
            </div>

        </div>`;
    });
}


/* ===== EXAMPLE GENERATOR ===== */
function generateExample(f){
    const name = (f.name||"").toUpperCase();
    const s = f.syntax || "";

    // common replacements for placeholders to produce realistic examples
    const map = [
        [/\b<*table>*\b/gi, 'Sales'],
        [/\b<*table_name>*\b/gi, 'Sales'],
        [/\bTable\b/g, 'Sales'],
        [/\bTables\b/g, 'Sales'],
        [/\bColumnName\b/g, 'Sales[Amount]'],
        [/\bColumn\b/g, 'Sales[Amount]'],
        [/\bColumns\b/g, 'Sales[Amount]'],
        [/\bColumn1\b/g, 'Sales[Amount]'],
        [/\bColumn2\b/g, 'Sales[Quantity]'],
        [/\bExpression\b/g, 'SUM(Sales[Amount])'],
        [/\b<*expression>*\b/gi, 'SUM(Sales[Amount])'],
        [/\bNumber\b/g, '123'],
        [/\bValue\b/g, '100'],
        [/\bText\b/g, "'example'"],
        [/\bDateTime\b/g, 'NOW()'],
        [/\bDate\b/g, 'Date[Date]'],
        [/\bStartDate\b/g, 'DATE(2020,1,1)'],
        [/\bEndDate\b/g, 'DATE(2020,12,31)'],
        [/\bStart\b/g, 'DATE(2020,1,1)'],
        [/\bEnd\b/g, 'DATE(2020,12,31)'],
        [/\bSearchColumn\b/g, 'Customers[CustomerID]'],
        [/\bSearchValue\b/g, "'ALFKI'"],
        [/\bResultColumn\b/g, 'Sales[Amount]'],
        [/\bID\b/g, '123'],
        [/\bParentID\b/g, '0'],
        [/\bPath\b/g, '"1|4|12"'],
        [/\bInterval\b/g, 'MONTH'],
        [/\bUnit\b/g, '"D"'],
        [/\bFilter\b/g, 'Year[Year]=2020'],
        [/\bfilters?\b/gi, 'Year[Year]=2020'],
    ];

    let ex = s;
    map.forEach(([re, val])=>{ ex = ex.replace(re, val); });

    // special-cased nicer examples for common functions
    const special = {
        'SUM': 'SUM(Sales[Amount])',
        'SUMX': 'SUMX(Sales, Sales[Quantity] * Sales[Price])',
        'AVERAGE': 'AVERAGE(Sales[Amount])',
        'CALCULATE': 'CALCULATE(SUM(Sales[Amount]), Year[Year]=2020)',
        'FILTER': 'FILTER(Sales, Sales[Amount] > 100)',
        'SELECTEDVALUE': "SELECTEDVALUE(Product[Category], 'All')",
        'LOOKUPVALUE': "LOOKUPVALUE(Product[Name], Product[ProductID], Sales[ProductID])",
        'RANKX': "RANKX(ALL(Products), SUM(Sales[Amount]))",
        'DIVIDE': 'DIVIDE(SUM(Sales[Amount]), SUM(Sales[Quantity]), 0)',
        'IF': "IF(Sales[Amount] > 100, 'High', 'Low')",
        'DATE': 'DATE(2021,12,31)'
    };

    if(special[name]) return special[name];

    // fallback: remove angle brackets and ellipses
    ex = ex.replace(/[<>]/g,'').replace(/\.\.\./g,'').trim();
    if(!ex) ex = `${f.name}(${f.syntax})`;
    return ex;
}

/* ===== FILTER ===== */
function filterAll(){
    const search=document.getElementById("searchInput").value.toLowerCase();
    const cat=categoryFilter.value;

    let filtered=daxFunctions.filter(f =>
        f.name.toLowerCase().includes(search)
    );

    if(cat !== "all"){
        filtered=filtered.filter(f=>f.category===cat);
    }

    render(filtered);
}

/* ===== LOAD CATEGORY ===== */
function loadCategories(){
    const cats=[...new Set(daxFunctions.map(f=>f.category))];
    cats.forEach(c=>{
        categoryFilter.innerHTML+=`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
    });
}

/* ===== COPY ===== */
function copyText(text){
    navigator.clipboard.writeText(text);
}

loadData();

</script>
